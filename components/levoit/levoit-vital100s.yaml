# Example configuration for Levoit Vital 100S Air Purifier
# Replace GPIO pins with the correct ones for your device

substitutions:
  name: "levoit-vital100s"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Levoit-Vital100S"
    password: !secret ap_password

captive_portal:

external_components:
  - source: ../../components
    components: [levoit]

uart:
  - id: uart_mcu2esp
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 115200

levoit:
  id: levoit_device
  model: VITAL100S

fan:
  - platform: levoit
    levoit: levoit_device
    name: "Fan"

switch:
  - platform: levoit
    levoit: levoit_device
    name: "Display"
    type: display
  - platform: levoit
    levoit: levoit_device
    name: "Child Lock"
    type: child_lock
  - platform: levoit
    levoit: levoit_device
    name: "Light Detect"
    type: light_detect

number:
  - platform: levoit
    levoit: levoit_device
    name: "Timer"
    type: timer
  - platform: levoit
    levoit: levoit_device
    name: "Auto Mode Room Size"
    type: efficiency_room_size
  - platform: levoit
    levoit: levoit_device
    name: "Filter Lifetime"
    type: filter_lifetime_months

sensor:
  - platform: levoit
    levoit: levoit_device
    name: "PM 2.5"
    type: pm25
  - platform: levoit
    levoit: levoit_device
    name: "AQI"
    type: aqi
  - platform: levoit
    levoit: levoit_device
    name: "Current CADR"
    type: current_cadr
  - platform: levoit
    levoit: levoit_device
    name: "Filter Life"
    type: filter_life_left
  - platform: levoit
    levoit: levoit_device
    name: "Timer Remaining"
    type: timer_current
  - platform: levoit
    levoit: levoit_device
    name: "Efficiency Counter"
    type: efficiency_counter

select:
  - platform: levoit
    levoit: levoit_device
    name: "Auto Mode"
    type: auto_mode

text_sensor:
  - platform: levoit
    levoit: levoit_device
    name: "MCU Version"
    type: mcu_version
  - platform: levoit
    levoit: levoit_device
    name: "ESP Version"
    type: esp_version
  - platform: levoit
    levoit: levoit_device
    name: "Error Message"
    type: error_message

binary_sensor:
  - platform: levoit
    levoit: levoit_device
    name: "Filter Low"
    type: filter_low

button:
  - platform: levoit
    levoit: levoit_device
    name: "Reset Filter Stats"
    type: reset_filter_stats
