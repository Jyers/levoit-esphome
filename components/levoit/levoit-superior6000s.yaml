# Example configuration for Levoit Superior 6000S Humidifier
# Replace GPIO pins with the correct ones for your device

substitutions:
  name: "levoit-superior6000s"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Levoit-Superior6000S"
    password: !secret ap_password

captive_portal:

external_components:
  - source: ../../components
    components: [levoit]

uart:
  - id: uart_mcu2esp
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 115200

levoit:
  id: levoit_device
  model: SUPERIOR6000S

fan:
  - platform: levoit
    levoit: levoit_device
    name: "Fan"

switch:
  - platform: levoit
    levoit: levoit_device
    name: "Display"
    type: display
  - platform: levoit
    levoit: levoit_device
    name: "Child Lock"
    type: child_lock
  - platform: levoit
    levoit: levoit_device
    name: "Auto Dry (Power Off)"
    type: auto_dry_power_off
  - platform: levoit
    levoit: levoit_device
    name: "Auto Dry (Water Empty)"
    type: auto_dry_water_empty

number:
  - platform: levoit
    levoit: levoit_device
    name: "Timer"
    type: timer
  - platform: levoit
    levoit: levoit_device
    name: "Humidity Target"
    type: humidity_target
  - platform: levoit
    levoit: levoit_device
    name: "Filter Lifetime"
    type: filter_lifetime_months

sensor:
  - platform: levoit
    levoit: levoit_device
    name: "Humidity"
    type: humidity
  - platform: levoit
    levoit: levoit_device
    name: "Temperature"
    type: temperature
  - platform: levoit
    levoit: levoit_device
    name: "Current CADR"
    type: current_cadr
  - platform: levoit
    levoit: levoit_device
    name: "Filter Life"
    type: filter_life_left
  - platform: levoit
    levoit: levoit_device
    name: "Filter Life (MCU)"
    type: filter_life_mcu
  - platform: levoit
    levoit: levoit_device
    name: "Timer Remaining"
    type: timer_current

select:
  - platform: levoit
    levoit: levoit_device
    name: "Auto Profile"
    type: auto_profile
  - platform: levoit
    levoit: levoit_device
    name: "Humidity Mode"
    type: humidity_subtype
  - platform: levoit
    levoit: levoit_device
    name: "Dry Level"
    type: dry_level

text_sensor:
  - platform: levoit
    levoit: levoit_device
    name: "MCU Version"
    type: mcu_version
  - platform: levoit
    levoit: levoit_device
    name: "ESP Version"
    type: esp_version
  - platform: levoit
    levoit: levoit_device
    name: "Error Message"
    type: error_message

binary_sensor:
  - platform: levoit
    levoit: levoit_device
    name: "Filter Low"
    type: filter_low
  - platform: levoit
    levoit: levoit_device
    name: "Cover Removed"
    type: cover_removed
  - platform: levoit
    levoit: levoit_device
    name: "Water Tank Empty"
    type: water_tank_empty
  - platform: levoit
    levoit: levoit_device
    name: "Drying"
    type: dry_active
  - platform: levoit
    levoit: levoit_device
    name: "Humidifying"
    type: humidifying

button:
  - platform: levoit
    levoit: levoit_device
    name: "Reset Filter Stats"
    type: reset_filter_stats
